# ============================================================
# SCPGO: Scan Context + Pose Graph Optimization
# YAML configuration (replaces ROS launch file)
# ============================================================

# -------------------- Input Data Paths --------------------
input:
  pcd_dir: "all_pcd_body/"                    # Directory containing per-frame PCD files
  tum_poses: "all_pcd_body/lidar_poses.txt"   # TUM format: timestamp tx ty tz qx qy qz qw
  gps_file: ""                                # Optional GPS CSV: timestamp,lat,lon,alt
  use_gps: false

# -------------------- Output Paths --------------------
output:
  save_directory: "output/"
  save_keyframes: true
  save_keyframes_directory: "output/"
  save_keyframes_full_cloud: true

# -------------------- Keyframe Selection --------------------
keyframe:
  meter_gap: 0.5       # add keyframe every N meters of translation
  deg_gap: 10.0         # add keyframe every N degrees of rotation

# -------------------- Scan Context --------------------
scan_context:
  dist_thres: 0.4              # SC descriptor distance threshold (0.1-0.6)
  max_radius: 80.0             # max radius in meters (80 outdoor, 20-40 indoor)
  lidar_height: 1            # LiDAR mounting height (0 if scans are in base frame)
  max_world_distance: 6.0     # reject SC loops where world-frame distance > N meters

# -------------------- Feature Switches --------------------
passthrough_mode: true              # skip keyframe selection, process all frames as keyframes
enable_loop_closure: false            # enable loop closure detection & PGO optimization. Set false with passthrough_mode=true for fast pure-odometry graph
use_ground_removal: false             # RANSAC ground removal
use_icp_submap_enhancement: false     # sliding window + spatial neighbors for ICP

# -------------------- ICP Loop Verification --------------------
icp:
  max_correspondence_distance: 150.0
  fitness_score_threshold: 0.2
  min_source_points: 50
  min_target_points: 50
  max_translation: 50.0
  max_rotation_deg: 30.0

# -------------------- Loop Closure Robust Kernel --------------------
loop:
  noise_score: 0.3
  kernel_param: 1.0
  kernel_type: "cauchy"    # cauchy / dcs / geman_mcclure
  min_frame_gap: 10         # after a loop edge is added, skip next N keyframes from detection

# -------------------- Spatial Loop Closure --------------------
spatial_loop:
  enabled: true                    # detect loops by Euclidean distance (bypasses SC)
  radius: 5.0                    # Euclidean distance threshold (m)
  fitness_thres: 0.15             # stricter ICP fitness than SC loops
  min_separation: 50              # minimum keyframe index gap

# -------------------- Map Visualization --------------------
mapviz_filter_size: 0.4           # leaf size for global map downsampling

# -------------------- Graceful Shutdown --------------------
input_silence_timeout: 50.0        # auto-exit after N seconds of inactivity (0=disabled)

# -------------------- Batch Playback --------------------
simulated_sensor_hz: 2.0          # frame playback rate in batch mode (Hz), 0=full speed

# -------------------- Foxglove WebSocket --------------------
websocket:
  enabled: true                       # master on/off switch
  host: "0.0.0.0"                     # bind address
  port: 8765                          # listening port
  publish_pointcloud: true
  publish_pose: true
  publish_icp_detail: true            # publish ICP source/target clouds for debugging
  publish_global_map: true            # publish global map after each PGO iteration
  global_map_leaf_size: 0.2           # voxel leaf for global map (m)
  pointcloud_downsample_leaf: 0.1     # voxel leaf (m), 0 = no downsampling
  max_points_per_message: 50000       # hard point count cap, 0 = unlimited
